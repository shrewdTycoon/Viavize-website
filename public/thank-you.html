<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Thank You — Viavize</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 0%, #002B5C 0%, #001838 55%, #000E21 100%);
        color: #FFFFFF;
        padding: 24px;
        text-align: center;
      }
      .grid-overlay {
        position: fixed;
        inset: 0;
        opacity: 0.03;
        background-image:
          linear-gradient(rgba(0,193,255,0.3) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,193,255,0.3) 1px, transparent 1px);
        background-size: 64px 64px;
        pointer-events: none;
      }
      .card { position: relative; max-width: 480px; }
      .logo { height: 30px; width: auto; margin: 0 auto 48px; display: block; }
      .check {
        width: 72px; height: 72px; border-radius: 50%;
        background: rgba(0,193,255,0.1);
        border: 1px solid rgba(0,193,255,0.3);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 28px;
        animation: pop 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }
      h1 {
        font-size: 34px; font-weight: 600; letter-spacing: -0.02em;
        margin-bottom: 14px;
        animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
      }
      h1 .accent { color: #00C1FF; }
      p {
        font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.65);
        margin-bottom: 36px;
        animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
      }
      .btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 14px 28px; border-radius: 12px;
        background: #00C1FF; color: #001838;
        font-weight: 600; font-size: 15px; text-decoration: none;
        box-shadow: 0 4px 24px rgba(0,193,255,0.25);
        transition: background 0.2s, transform 0.2s;
        animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both;
      }
      .btn:hover { background: #00ADDE; transform: translateY(-2px); }
      @keyframes pop {
        from { opacity: 0; transform: scale(0.6); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .check, h1, p, .btn { animation: none; }
      }
    </style>
  </head>
